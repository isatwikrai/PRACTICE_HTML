<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Food delivery</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            color: #2d2d2d;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 8%;
            background: #fff;
            box-shadow: 0 2px 12px rgb(0 0 0 / 8%);
        }

        .logo {
            color: #e23744;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: #4a4a4a;
            font-size: 1rem;
            text-decoration: none;
            transition: color 160ms ease;
        }

        nav a:hover,
        nav a:focus-visible {
            color: #e23744;
        }

        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 4rem 1.5rem;
            background: linear-gradient(135deg, #fff5f5, #fff 65%);
            text-align: center;
        }

        .hero {
            max-width: 760px;
            color: #e23744;
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -2px;
        }

        footer {
            padding: 1rem 1.5rem;
            background: #f8f8f8;
            color: #777;
            text-align: center;
        }

        footer p {
            margin: 0;
            font-size: 0.875rem;
        }

        @media (max-width: 520px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            nav {
                gap: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">zomato</div>
        <nav aria-label="Main navigation">
            <a href="/home">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <main>
        <div class="hero">Order food anytime, anywhere</div>
    </main>

    <footer>
        <p>© 2024 Zomato. All rights reserved.</p>
    </footer>

</body>

</html>
